# Source manifest. `enabled: true` sources are ingested by scripts/ingest.py.
# Put each file in data/raw/ under the exact `file` name. If you hand-correct the text, save it as
# data/raw/<same-name>.txt and it will be used instead of the PDF.
# `status`: opened = text was read and checked; found = link seen in search only (open and confirm).
# Prefer official text (pakistancode.gov.pk, provincial law sites) over mirrors when they differ.

sources:
  # ---- Harassment (applies across Pakistan) -------------------------------------------------------
  - id: harassment_2010_fospah
    act: "Protection against Harassment of Women at the Workplace Act, 2010 (amended 2022)"
    jurisdiction: pakistan
    topic: harassment
    file: harassment_2010_fospah.pdf
    url: https://www.fospah.gov.pk/SiteImage/Misc/files/PAHAW_amend_2022.pdf
    enabled: true
    status: opened
    notes: "File is the copy with Punjab adaptation footnotes (Governor, Punjab Amendment Act 2012). Federal text is in raw/FOSPAH Laws and Rules.pdf. Footnotes are mixed into the body; compare s.7 and s.9 against the federal text and hand-correct if needed."

  - id: harassment_2010_sja
    act: "Protection against Harassment of Women at the Workplace Act, 2010 (amended 2022)"
    jurisdiction: pakistan
    topic: harassment
    file: harassment_2010_sja.pdf
    url: "https://sja.gos.pk/assets/Updated_Laws/Protection%20against%20Harassment%20of%20Women%20at%20the%20Workplace%20Act%2C%202010%20%28Amendments%20upto%20date%29.pdf"
    enabled: false # enable this and disable the FOSPAH copy once you have compared them (never both)
    status: found
    notes: "Consolidated up to 25 Jan 2022; cleaner layout."

